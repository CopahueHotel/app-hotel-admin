# Preserve existing IP links after activating admin.copahuehotel.com.ar.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 162.35.114.196;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://admin.copahuehotel.com.ar$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 162.35.114.196;
    ssl_certificate /etc/letsencrypt/live/162.35.114.196/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/162.35.114.196/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host != "162.35.114.196") { return 444; }
    location / { return 308 https://admin.copahuehotel.com.ar$request_uri; }
}
