# Enable the TLS servers only after issuing this certificate.
server {
    listen 80;
    listen [::]:80;
    server_name admin.copahuehotel.com.ar pruebas.copahuehotel.com.ar;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.copahuehotel.com.ar;
    ssl_certificate /etc/letsencrypt/live/hotel-admin-dominios/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotel-admin-dominios/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pruebas.copahuehotel.com.ar;
    ssl_certificate /etc/letsencrypt/live/hotel-admin-dominios/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotel-admin-dominios/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
